    "title": "Nurse Scheduler — Sprint 3",
    "version": "1.1.0",
    "description": "หัวหน้า (head) แก้ได้, viewer อ่านได้ ใน ward ที่ provision ฝั่ง server. ช่วงเวลา [start,end), period เป็นนาทีจากเที่ยงคืนวันตาราง. body จำกัด 64 KiB. Staffing เฉพาะวันแทนค่า default ที่ start/end เดียวกัน. NightEnd > NightStart และไม่เกิน 24 ชั่วโมง. AUTO/approval workflow เป็น Sprint 4/6."
  },
